<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidOps Analytics | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="VoidOps Analytics logo" class="logo">

        <h1 class="visually-hidden">VoidOps Analytics</h1>

        <p class="tagline">
            TURNING OPERATIONAL DATA INTO ACTIONABLE INSIGHTS.
        </p>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main aria-label="Contact content">
        <section class="page-intro">
            <h2>Contact VoidOps Analytics</h2>
            <p>
                Use the form below to request more information about analytics, dashboards,
                reporting, or process improvement services.
            </p>
        </section>

        <section class="contact-section">
            <form class="contact-form" aria-label="Contact form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Submit</button>
                <p id="formMessage" class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 VoidOps Analytics</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
